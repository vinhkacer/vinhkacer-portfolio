backend:
  name: github
  repo: vinhkacer/vinhkacer-portfolio
  branch: main

# Tùy chọn chạy backend nội bộ khi test trên máy qua: npx decap-server
local_backend: true

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "projects"
    label: "Dự án Portfolio"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Tiêu đề dự án", name: "title", widget: "string" }
      - { label: "Thể loại", name: "category", widget: "select", options: ["MV", "Thủng Long", "VFX Breakdown", "Commercial"] }
      - label: "Vai trò đảm nhiệm (Roles)"
        name: "roles"
        widget: "select"
        multiple: true
        required: false
        options:
          - "VFX"
          - "Edit"
          - "3D Animation"
          - "3D Model"
          - "Sound Design"
          - "Audio Mixing"
          - "Color Grading"
          - "Motion Graphics"
          - "Compositing"
      - { label: "Video chính (.mp4)", name: "video", widget: "file" }
      - { label: "Ảnh bìa Thumbnail", name: "thumbnail", widget: "image" }
      - { label: "Link TikTok (Tùy chọn)", name: "tiktok_url", widget: "string", required: false, hint: "Dán URL video TikTok gốc nếu có" }
      - { label: "Link YouTube (Tùy chọn)", name: "youtube_url", widget: "string", required: false, hint: "Dán URL video YouTube gốc nếu có" }
      - { label: "Video VFX Breakdown (.mp4)", name: "breakdown_video", widget: "file", required: false }
      - { label: "Ảnh bìa Breakdown Thumbnail", name: "breakdown_thumb", widget: "image", required: false }
      - { label: "Video VFX Breakdown 02 (.mp4 nếu có)", name: "breakdown_video_2", widget: "file", required: false }
      - { label: "Ảnh bìa Breakdown 02 Thumbnail", name: "breakdown_thumb_2", widget: "image", required: false }
      - { label: "Mô tả ngắn", name: "description", widget: "text", required: false }
